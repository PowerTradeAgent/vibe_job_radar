name: browser-acceptance
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  chromium-user-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install developer-only browser test tools
        run: |
          python -m pip install playwright "packaging>=24.2"
          python -m playwright install --with-deps chromium
      - name: Exercise actual browser onboarding and downloads
        run: |
          python scripts/run_browser_acceptance.py
          python scripts/run_advanced_browser.py
          python scripts/run_collection_guidance_browser.py
          python scripts/run_resume_browser.py
          python scripts/run_guided_browser.py
          python scripts/run_guided_review_browser.py
          python scripts/run_recovery_browser.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: browser-acceptance
          path: browser-acceptance/
      - name: Qualify source bytes for candidate packaging
        run: python scripts/verify_candidate.py
      - name: Build source release candidate
        run: python scripts/build_candidate.py --evidence release-verification/result.json
      - name: Save source release candidate
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: source-release-candidate
          path: release-candidate/
