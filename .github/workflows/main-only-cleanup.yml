name: approved-main-only-cleanup
on:
  pull_request:
    paths:
      - '.github/workflows/main-only-cleanup.yml'
      - 'scripts/cleanup_merged_branches.py'
      - 'tests/test_branch_cleanup.py'
  push:
    branches: [main]
    paths: ['.github/workflows/main-only-cleanup.yml']
permissions:
  contents: read
jobs:
  validate-maintenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_branch_cleanup.py -v
  approved-cleanup:
    if: >-
      github.event_name == 'push' && github.repository == 'saksim/vibe_job_radar' && startsWith(github.event.head_commit.message, 'Complete approved main-only cleanup (issue 12)')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all approved heads then atomically remove merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cleanup_merged_branches.py --apply
      - name: Retain before-and-after branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-only-cleanup-audit
          path: branch-cleanup-audit.json
