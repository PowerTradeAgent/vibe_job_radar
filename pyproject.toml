[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-job-radar"
version = "0.1.0"
description = "Evidence-first Chinese recruiting requirement analysis and measurable profile drafting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WEIYU AI Studio"}]
dependencies = []

[project.scripts]
vibe-radar = "vibe_job_radar.cli:main"
vibe-radar-ui = "vibe_job_radar.workbench:main"
vibe-radar-collect = "vibe_job_radar.collection:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibe_job_radar = ["defaults.json", "workbench.html", "workbench.js", "advanced.html", "advanced.js"]
